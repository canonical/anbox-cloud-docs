name: Documentation checks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Spelling check
            target: spelling
          - name: Link check
            target: linkcheck
          - name: Inclusive language check
            target: woke
          - name: Markdown linting
            target: lint-md
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Run check
        run: make ${{ matrix.check.target }}
